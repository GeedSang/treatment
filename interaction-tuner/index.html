<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>交互节奏调试 Agent</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header><div><p class="eyebrow">INTERACTION TUNER · MVP</p><h1>交互节奏调试 Agent</h1><p class="sub">把“自然地亮起来”变成可观察、可复测的参数。</p></div><span id="status" class="pill">待测试</span></header>
    <section class="grid">
      <aside class="panel controls"><h2>项目配置</h2><label>项目名称<input id="projectName" value="桌面灯光原型"></label><label>触发事件<input id="triggerText" value="有人靠近"></label><label>反馈动作<input id="feedbackText" value="灯光渐亮"></label><button id="saveProject" class="secondary">保存为项目模板</button>
        <h2>体验目标</h2><div class="modes"><button data-mode="natural" class="active">自然</button><button data-mode="sensitive">灵敏</button><button data-mode="restrained">克制</button></div>
        <h2>参数</h2><label>触发距离 <output id="distanceOut">120</output> cm<input id="distance" type="range" min="40" max="250" value="120"></label>
        <label>进入延迟 <output id="enterOut">0.8</output> s<input id="enter" type="range" min="0" max="2" step="0.1" value="0.8"></label>
        <label>渐亮时间 <output id="fadeOut">1.8</output> s<input id="fade" type="range" min="0.4" max="4" step="0.1" value="1.8"></label>
        <label>离开延迟 <output id="exitOut">2.0</output> s<input id="exit" type="range" min="0" max="5" step="0.1" value="2"></label>
        <button id="run" class="primary">运行三组模拟</button><button id="apply" class="secondary" disabled>应用 Agent 建议</button>
      </aside>
      <section class="panel stage"><div class="stage-head"><div><h2>实时模拟</h2><p id="scenario">等待测试轨迹</p></div><div class="lamp" id="lamp"><span></span></div></div><div class="track"><div class="person" id="person">●</div><div class="threshold" id="threshold"></div></div><div class="metrics"><div><b id="response">--</b><small>响应时间</small></div><div><b id="false">--</b><small>误触发</small></div><div><b id="leave">--</b><small>退出时间</small></div></div><div class="diagnosis" id="diagnosis">Agent 将观察“触发事件 → 反馈动作”的三组轨迹，再给出一条可解释的调参建议。</div></section>
    </section>
    <section class="panel history"><div><h2>版本记录</h2><p>每次调参都保留“为什么”。</p></div><div id="versions" class="versions"><span>尚未生成版本</span></div><button id="accept" class="confirm" disabled>确认当前体验</button></section>
    <section class="panel" style="padding:20px 22px;margin-top:18px"><div style="display:flex;justify-content:space-between"><div><h2>Agent 工作流</h2><p>像项目协作者一样拆解、执行、复盘。</p></div><button id="export" class="secondary" style="width:auto;margin:0">导出项目说明</button></div><div id="log" style="display:grid;gap:8px;margin-top:14px"><div><i>等待任务</i><span>填写项目后，Agent 会生成调试计划。</span></div></div></section>
  </main><script src="app.js"></script>
</body></html>
